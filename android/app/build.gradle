plugins { id 'com.android.application' }
def vc = (System.getenv("VERSION_CODE") ?: "1") as int
android {
    namespace 'com.hangulk.app'
    compileSdk 35
    defaultConfig {
        applicationId "com.hangulk.app"
        minSdk 21
        targetSdk 35
        versionCode vc
        versionName "1.0." + vc
    }
    signingConfigs {
        release {
            storeFile file("../../hangulk-upload.p12")
            storeType "pkcs12"
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias "upload"
            keyPassword System.getenv("KEYSTORE_PASSWORD")
        }
    }
    buildTypes { release { minifyEnabled false; if (System.getenv("KEYSTORE_PASSWORD")) { signingConfig signingConfigs.release } } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0' }
