<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#C2402F"><link rel="apple-touch-icon" href="icon-192.png"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>한글 첫걸음</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Gowun+Dodum&family=Noto+Sans+KR:wght@500;700&display=swap">
<style>
/* Layout: 원고지(manuscript-grid) notebook app — sticky header, one panel per tab, fixed bottom tab bar */
:root{
  --paper:#F5F7F5; --sheet:#FFFFFF; --ink:#1C2422; --muted:#5B6A66; --line:#D8E0DD;
  --grid:#E7C3BD; --accent:#1F6F6B; --accent-soft:#DCEDEA; --seal:#C2402F;
  --good:#2C8A4C; --good-soft:#DFF2E5; --bad:#C2402F; --bad-soft:#FBE3DF;
  --f-disp:"Gowun Batang","Nanum Myeongjo",serif;
  --f-body:"Gowun Dodum",system-ui,-apple-system,sans-serif;
  --f-glyph:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#141A19; --sheet:#1D2523; --ink:#EAF0EE; --muted:#98A7A3; --line:#34413E;
  --grid:#5C3A35; --accent:#62BDB4; --accent-soft:#1E3633; --seal:#E8735F;
  --good:#5DC584; --good-soft:#1C3324; --bad:#F0806C; --bad-soft:#3A221E; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#141A19; --sheet:#1D2523; --ink:#EAF0EE; --muted:#98A7A3; --line:#34413E;
  --grid:#5C3A35; --accent:#62BDB4; --accent-soft:#1E3633; --seal:#E8735F;
  --good:#5DC584; --good-soft:#1C3324; --bad:#F0806C; --bad-soft:#3A221E; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);
  display:flex;align-items:center;gap:10px;padding-block:12px;border-bottom:1px solid var(--line);margin-bottom:16px}
.seal{width:36px;height:36px;border-radius:6px;background:var(--seal);color:#fff;display:grid;place-items:center;
  font-family:var(--f-disp);font-size:20px;flex:none;transform:rotate(-4deg)}
h1{font-family:var(--f-disp);font-size:22px;margin:0;line-height:1.1}
h1 small{display:block;font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:400}
.hdr-tools{margin-left:auto;display:flex;gap:6px}
.pill{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:6px 11px;font-size:13px;white-space:nowrap}
.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--sheet)}
h2{font-family:var(--f-disp);font-size:20px;margin:0 0 4px;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 14px;font-size:14px}
.label{font-size:12px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin:18px 0 8px}
.panel[hidden]{display:none}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--sheet);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(6,1fr);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 2px;border-radius:10px;font-size:12px;color:var(--muted)}
nav.tabs button b{font-family:var(--f-glyph);font-size:20px;line-height:1.2;font-weight:700}
nav.tabs button[aria-selected="true"]{color:var(--accent);background:var(--accent-soft)}

/* detail card */
.detail{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.cell{width:108px;height:108px;position:relative;border:1.5px solid var(--grid);display:grid;place-items:center;
  font-family:var(--f-glyph);font-size:70px;font-weight:500;line-height:1;background:var(--sheet)}
.cell::before,.cell::after{content:"";position:absolute;background:none;border-color:var(--grid);border-style:dashed;opacity:.8}
.cell::before{left:50%;top:0;bottom:0;border-width:0 0 0 1px}
.cell::after{top:50%;left:0;right:0;border-width:1px 0 0 0}
.cell span{position:relative;z-index:1}
.d-name{font-family:var(--f-disp);font-size:20px}
.d-rom{font-family:ui-monospace,Menlo,monospace;font-size:14px;color:var(--accent)}
.d-hint{font-size:14px;color:var(--muted);margin:4px 0 10px}
.row{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--sheet);border-radius:10px;padding:9px 14px;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--sheet)}
.btn.big{padding:13px 20px;font-size:16px}
.btn:disabled{opacity:.45;cursor:default}

/* jamo grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.jamo{border:1px solid var(--line);background:var(--sheet);border-radius:10px;padding:8px 2px 6px;text-align:center}
.jamo b{display:block;font-family:var(--f-glyph);font-size:28px;font-weight:500;line-height:1.2}
.jamo i{font-style:normal;font-size:11px;color:var(--muted);font-family:ui-monospace,Menlo,monospace}
.jamo[aria-current="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}

.chart-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--sheet)}
.gchart{border-collapse:collapse;font-variant-numeric:tabular-nums}
.gchart th{font-family:var(--f-glyph);font-weight:700;color:var(--accent);background:var(--accent-soft);padding:6px 8px;position:sticky;left:0}
.gchart thead th{position:static}
.gchart td{border:1px solid var(--line);padding:0}
.gchart td button{border:0;background:none;width:56px;padding:6px 2px;text-align:center}
.gchart td b{display:block;font-family:var(--f-glyph);font-size:20px;font-weight:500;line-height:1.2}
.gchart td i{font-style:normal;font-size:12px;color:var(--seal);font-weight:700}
.levels{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px;margin-bottom:16px}
.lv{grid-column:span 2;border:1px solid var(--line);background:var(--sheet);border-radius:10px;padding:6px 2px;text-align:center;min-width:0}
.lv b{display:block;font-family:var(--f-disp);font-size:20px;line-height:1.1}
.lv small{display:block;font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
.lv i{display:block;font-style:normal;font-size:11px;color:var(--seal);letter-spacing:1px;min-height:15px}
.lv[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.lv[aria-pressed="true"] b,.lv[aria-pressed="true"] small,.lv[aria-pressed="true"] i{color:var(--sheet)}
.g-items button.done b::after{content:" ✓";color:var(--good)}
.lv.kpop{grid-column:span 5;display:flex;align-items:center;justify-content:center;gap:10px;padding:8px}
.lv.kpop b{font-size:17px;white-space:nowrap}.lv.kpop small{display:none}.lv.kpop i{min-height:0}
.songs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-bottom:6px}
.song{display:block;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--sheet);border-radius:10px;padding:8px 10px;min-width:0}
.song .artist{display:inline-block;font-size:10.5px;letter-spacing:.06em;background:var(--ink);color:var(--sheet);border-radius:4px;padding:1px 5px;margin-bottom:3px}
.song b{display:block;font-family:var(--f-glyph);font-size:17px;font-weight:500;word-break:keep-all}
.song small{display:block;font-size:12px;color:var(--muted);line-height:1.3}
.song small.pron{color:var(--seal);font-weight:700}
.song::after{content:"▶ YouTube";display:block;font-size:11px;color:var(--accent);margin-top:3px}
.song-list{display:flex;flex-direction:column;gap:8px}
.scard{display:flex;gap:12px;align-items:center;border:1px solid var(--line);background:var(--sheet);border-radius:12px;padding:12px;text-align:left;width:100%}
.scard .disc{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--seal);color:#fff;font-size:20px}
.scard.mine .disc{background:var(--accent)}
.scard b{display:block;font-family:var(--f-glyph);font-size:17px;font-weight:500}
.scard small{display:block;font-size:12.5px;color:var(--muted)}
.fl{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;font-size:14px}
.fl input,.fl textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px;width:100%}
.lyrics{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-direction:column;gap:6px}
.lyrics li{border:1px solid var(--line);background:var(--sheet);border-radius:10px;padding:10px 12px;cursor:pointer;transition:background .2s}
.lyrics li b{display:block;font-family:var(--f-glyph);font-size:20px;font-weight:500;word-break:keep-all}
.lyrics li .pron{display:block;font-size:13.5px;font-weight:700;color:var(--seal)}
.lyrics li small{display:block;font-size:13px;color:var(--muted)}
.lyrics li.on{background:var(--accent-soft);border-color:var(--accent)}
.lyrics li.on b{color:var(--accent)}
.tapbar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:7;display:flex;gap:8px;justify-content:center;
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--sheet);border-top:1px solid var(--line)}
.tapbar #vTapNext{flex:1;max-width:360px}
.copybox{font-size:13px;background:var(--paper);border-radius:8px;padding:8px;margin:6px 0;word-break:break-word}
@media (prefers-reduced-motion:reduce){.lyrics li{transition:none}}
.parts{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px;margin:6px 0 2px;min-height:44px}
.part{border:1px solid var(--line);background:var(--sheet);border-radius:10px;padding:6px 10px;text-align:center;line-height:1.2}
.part b{display:block;font-family:var(--f-glyph);font-size:20px;font-weight:500}
.part small{display:block;font-size:11px;color:var(--muted)}
.part.on{border-color:var(--seal);background:var(--bad-soft)}
.part.on b{color:var(--seal)}
.parts .arr{color:var(--muted)}
/* builder */
.formula{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:6px 0 4px;font-family:var(--f-glyph);font-size:26px}
.formula .op{color:var(--muted);font-size:20px}
.formula .p{min-width:42px;text-align:center;border-bottom:2px solid var(--line)}
.result{display:flex;justify-content:center;margin:8px 0}
.result .cell{width:150px;height:150px;font-size:104px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--sheet);border-radius:8px;min-width:46px;padding:5px 6px;font-family:var(--f-glyph);font-size:20px;line-height:1.2;display:flex;flex-direction:column;align-items:center}
.chip small{font-family:var(--f-body);font-size:12px;font-weight:700;color:var(--seal);line-height:1.2}
.chip[aria-pressed="true"] small{color:var(--sheet)}
.opt small{display:block;font-family:var(--f-body);font-size:13px;font-weight:700;color:var(--seal);margin-top:2px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--sheet)}
.challenge{background:var(--accent-soft);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}
.challenge .tgt{font-family:var(--f-glyph);font-size:40px;font-weight:700;line-height:1}
.challenge.done{background:var(--good-soft)}

/* writing */
.pad-wrap{display:flex;justify-content:center;margin:10px 0}
.pad{position:relative;width:min(100%,320px);aspect-ratio:1;max-width:100%;border:2px solid var(--grid);background:var(--sheet);touch-action:none}
.pad::before,.pad::after{content:"";position:absolute;border-color:var(--grid);border-style:dashed;pointer-events:none}
.pad::before{left:50%;top:0;bottom:0;border-width:0 0 0 1px}
.pad::after{top:50%;left:0;right:0;border-width:1px 0 0 0}
.pad canvas{position:absolute;inset:0;width:100%;height:100%;z-index:1}
.stars{font-size:26px;letter-spacing:4px;text-align:center;min-height:36px;color:var(--seal)}
.msg{text-align:center;font-size:14px;color:var(--muted);min-height:22px}
.navrow{display:flex;justify-content:space-between;align-items:center;gap:8px}

/* quiz */
.q-top{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 16px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.q-card{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:22px 16px;text-align:center}
.q-pic{font-size:72px;line-height:1.1}
.q-mean{color:var(--muted);margin-top:4px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.opt{border:1.5px solid var(--line);background:var(--sheet);border-radius:12px;padding:14px 6px;font-family:var(--f-glyph);font-size:24px;font-weight:500}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.big-num{font-family:var(--f-disp);font-size:56px;line-height:1;font-variant-numeric:tabular-nums}

/* speaking */
.say-target{font-family:var(--f-glyph);font-size:40px;font-weight:700;letter-spacing:2px;text-align:center;line-height:1.3;word-break:keep-all}
.say-target span{border-radius:6px;padding:0 2px;cursor:pointer}
.say-target .ok{color:var(--good);background:var(--good-soft)}
.say-target .miss{color:var(--bad);background:var(--bad-soft);text-decoration:underline dotted}
.say-pron{text-align:center;font-size:20px;font-weight:700;color:var(--seal);margin-top:2px}
.g-items small.pron{color:var(--seal);font-weight:700;font-size:12.5px}
.say-rom{opacity:.75;text-align:center;font-family:ui-monospace,Menlo,monospace;color:var(--accent);font-size:14px}
.say-mean{text-align:center;color:var(--muted);font-size:14px;margin-bottom:12px}
.mic{width:88px;height:88px;border-radius:50%;border:0;background:var(--seal);color:#fff;font-size:15px;display:grid;place-items:center;margin:0 auto}
.mic.on{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--seal) 50%,transparent)}50%{box-shadow:0 0 0 14px transparent}}
@media (prefers-reduced-motion:reduce){.mic.on{animation:none;outline:4px solid var(--seal)}.bar i{transition:none}}
.feedback{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:14px;font-size:14px}
.feedback[hidden]{display:none}
.feedback .score{font-family:var(--f-disp);font-size:28px}
.tips{margin:8px 0 0;padding-left:18px}
.say-list{display:flex;flex-direction:column;gap:6px}
.g-head{font-family:var(--f-disp);font-size:16px;margin-top:10px}
.g-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
.g-items button{border:1px solid var(--line);background:var(--sheet);border-radius:10px;padding:8px 10px;text-align:left;min-width:0}
.g-items b{display:block;font-family:var(--f-glyph);font-size:17px;font-weight:500;word-break:keep-all}
.g-items small{display:block;font-size:12px;color:var(--muted);line-height:1.3}
.g-items button[aria-current="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.g-items button[aria-current="true"] b{color:var(--accent)}
.note{font-size:13px;color:var(--muted);background:var(--accent-soft);border-radius:10px;padding:10px 12px;margin-top:12px}
.note[hidden]{display:none}
@media (max-width:420px){.detail{grid-template-columns:1fr;justify-items:center;text-align:center}.detail .row{justify-content:center}}
</style>

<div class="wrap">
<header>
  <div class="seal" aria-hidden="true">한</div>
  <h1>한글 첫걸음<small data-t="sub"></small></h1>
  <div class="hdr-tools">
    <button class="pill" id="slowBtn" aria-pressed="false" data-t="slow"></button>
    <button class="pill" id="langBtn">PT</button>
  </div>
</header>

<!-- 1. 소리 -->
<section class="panel" id="p-sound">
  <h2 data-t="soundTitle"></h2>
  <p class="lead" data-t="soundLead"></p>
  <div class="detail" id="jDetail">
    <div class="cell"><span id="jdGlyph">ㄱ</span></div>
    <div>
      <div class="d-name" id="jdName"></div>
      <div class="d-rom" id="jdRom"></div>
      <p class="d-hint" id="jdHint"></p>
      <div class="row">
        <button class="btn primary" id="jdPlay" data-t="listen"></button>
        <button class="btn" id="jdName2" data-t="listenName"></button>
        <button class="btn" id="jdWrite" data-t="goWrite"></button>
      </div>
    </div>
  </div>
  <div class="label" data-t="consonants"></div>
  <div class="grid" id="gCons"></div>
  <div class="label" data-t="dbl"></div>
  <div class="grid" id="gDbl"></div>
  <div class="label" data-t="vowels"></div>
  <div class="grid" id="gVow"></div>
  <div class="label" data-t="vowels2"></div>
  <div class="grid" id="gVow2"></div>
  <div class="label" data-t="chart"></div>
  <div class="chart-wrap"><table class="gchart" id="gChart"></table></div>
</section>

<!-- 2. 조합 -->
<section class="panel" id="p-build" hidden>
  <h2 data-t="buildTitle"></h2>
  <p class="lead" data-t="buildLead"></p>
  <div class="formula"><span class="p" id="fC">ㄱ</span><span class="op">+</span><span class="p" id="fV">ㅏ</span><span class="op">+</span><span class="p" id="fJ">·</span><span class="op">=</span></div>
  <div class="result"><div class="cell" id="bRes" role="button" tabindex="0"><span id="bResT">가</span></div></div>
  <div class="msg" id="bRom"></div>
  <div class="challenge" id="chal">
    <div class="tgt" id="chalT">?</div>
    <div style="flex:1;min-width:140px;font-size:14px" id="chalMsg"></div>
    <button class="btn" id="chalBtn" data-t="newChal"></button>
  </div>
  <div class="label" data-t="first"></div><div class="chips" id="cC"></div>
  <div class="label" data-t="middle"></div><div class="chips" id="cV"></div>
  <div class="label" data-t="last"></div><div class="chips" id="cJ"></div>
</section>

<!-- 3. 쓰기 -->
<section class="panel" id="p-write" hidden>
  <h2 data-t="writeTitle"></h2>
  <p class="lead" data-t="writeLead"></p>
  <div class="row" role="group" id="wSets">
    <button class="pill" data-set="c" aria-pressed="true" data-t="consonants"></button>
    <button class="pill" data-set="v" aria-pressed="false" data-t="vowels"></button>
    <button class="pill" data-set="s" aria-pressed="false" data-t="syll"></button>
  </div>
  <div class="pad-wrap"><div class="pad" id="pad"><canvas id="guide"></canvas><canvas id="ink"></canvas></div></div>
  <div class="stars" id="wStars" aria-live="polite"></div>
  <div class="msg" id="wMsg"></div>
  <div class="parts" id="wParts" aria-live="polite"></div>
  <div class="navrow" style="margin-top:8px">
    <button class="btn" id="wPrev" aria-label="이전">◀</button>
    <div class="row">
      <button class="btn" id="wClear" data-t="clear"></button>
      <button class="btn" id="wPlay" data-t="listen"></button>
      <button class="btn primary" id="wCheck" data-t="check"></button>
    </div>
    <button class="btn" id="wNext" aria-label="다음">▶</button>
  </div>
  <label class="row" style="justify-content:center;margin-top:12px;font-size:14px;color:var(--muted);gap:6px">
    <input type="checkbox" id="wGuide" checked> <span data-t="showGuide"></span>
  </label>

let ttsOk=false;
function ttsWarn(){

    :'🔇 Sem som nesta prévia do app Claude. Abra o endereço do app no Chrome do celular. (toque para fechar)';

function speak(txt,rate){
  if(!('speechSynthesis' in window)||typeof SpeechSynthesisUtterance==='undefined'){ttsWarn();return}
  try{
    speechSynthesis.cancel();
    if(!koVoice)pickVoice();
    const u=new SpeechSynthesisUtterance(txt);u.lang='ko-KR';if(koVoice)u.voice=koVoice;
    u.rate=rate||(slow?0.55:0.85);u.volume=1;
    let started=false;
    u.onstart=()=>{started=true;ttsOk=true;const n=$('ttsNote');if(n)n.remove()};
    u.onerror=e=>{if(e.error!=='interrupted'&&e.error!=='canceled')ttsWarn()};
    // 크롬 버그: cancel 직후 바로 speak 하면 무시되는 경우가 있어 잠깐 기다림
    setTimeout(()=>{speechSynthesis.resume();speechSynthesis.speak(u)},60);
    setTimeout(()=>{if(!started&&!ttsOk)ttsWarn()},2200);
  }catch(e){ttsWarn()}
}

let bC='ㄱ',bV='ㅏ',bJ='',chal=null;
const BJ=['','ㄱ','ㄴ','ㄷ','ㄹ','ㅁ','ㅂ','ㅅ','ㅇ','ㅈ','ㅊ','ㅎ'];
function chips(id,list,get,set,rd){
  const box=$(id);box.innerHTML='';
  list.forEach(x=>{const b=document.createElement('button');b.className='chip';b.innerHTML=`<span>${x||'✕'}</span>${x&&rd&&rd(x)?`<small>${rd(x)}</small>`:''}`;
    b.setAttribute('aria-label',x||(lang==='ko'?'받침 없음':'sem final'));
    b.addEventListener('click',()=>{set(x);paint();renderBuild()});box.appendChild(b)});
  function paint(){[...box.children].forEach((b,i)=>b.setAttribute('aria-pressed',list[i]===get()))}
  paint();return paint;
}
const ROM_J={'':'','ㄱ':'k','ㄴ':'n','ㄷ':'t','ㄹ':'l','ㅁ':'m','ㅂ':'p','ㅅ':'t','ㅇ':'ng','ㅈ':'t','ㅊ':'t','ㅎ':'t'};
const pC=chips('cC',CHO,()=>bC,x=>bC=x,x=>PT_C[x]||'—'),pV=chips('cV',JUNG,()=>bV,x=>bV=x,x=>PT_V[x]),pJ=chips('cJ',BJ,()=>bJ,x=>bJ=x,x=>ROM_J[x]);
const ROM_C={'ㄱ':'g','ㄲ':'kk','ㄴ':'n','ㄷ':'d','ㄸ':'tt','ㄹ':'r','ㅁ':'m','ㅂ':'b','ㅃ':'pp','ㅅ':'s','ㅆ':'ss','ㅇ':'','ㅈ':'j','ㅉ':'jj','ㅊ':'ch','ㅋ':'k','ㅌ':'t','ㅍ':'p','ㅎ':'h'};
function renderBuild(){

  $('fC').textContent=bC;$('fV').textContent=bV;$('fJ').textContent=bJ||'·';$('bResT').textContent=s;
  $('bRom').textContent=ptRead(bC,bV)+ROM_J[bJ];

function renderChal(){

  if(!chal){box.classList.remove('done');$('chalT').textContent='?';$('chalMsg').textContent=t('chalIdle');return}
  if(chal.done){box.classList.add('done');$('chalT').textContent=chal.s;$('chalMsg').textContent=t('chalOk');return}
  box.classList.remove('done');$('chalT').textContent=chal;$('chalMsg').textContent=t('chalAsk');

$('chalBtn').onclick=()=>{

const SYL=['가','나','다','마','바','사','아','한','글','물','집','꽃','책','별','눈','손','빵','엄','마'];
let wSet='c',wIdx=0;
const writeList=()=>wSet==='c'?[...CONS,...DBL].map(a=>a[0]):wSet==='v'?[...VOW,...VOW2].map(a=>a[0]):SYL;
function syncSets(){document.querySelectorAll('#wSets .pill').forEach(b=>b.setAttribute('aria-pressed',b.dataset.set===wSet))}
document.querySelectorAll('#wSets .pill').forEach(b=>b.onclick=()=>{wSet=b.dataset.set;wIdx=0;syncSets();loadW()});
const guide=$('guide'),ink=$('ink'),gx=guide.getContext('2d'),ix=ink.getContext('2d');
let padPx=0,drawn=false;
const GLYPH_FONT='"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
function drawGlyph(ctx,size,g,style){
  ctx.save();ctx.font=`500 ${Math.round(size*0.74)}px ${GLYPH_FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';
  if(style.fill){ctx.fillStyle=style.fill;ctx.fillText(g,size/2,size/2+size*0.02)}
  if(style.stroke){ctx.strokeStyle=style.stroke;ctx.lineWidth=style.lw;ctx.lineJoin='round';ctx.strokeText(g,size/2,size/2+size*0.02)}
  ctx.restore();
}
function cssVar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function sizePad(){
  const r=$('pad').getBoundingClientRect();if(!r.width)return;
  const dpr=window.devicePixelRatio||1,px=Math.round(r.width*dpr);
  if(px!==padPx){padPx=px;[guide,ink].forEach(c=>{c.width=px;c.height=px});drawn=false}
  paintGuide();
}
function paintGuide(){
  gx.clearRect(0,0,padPx,padPx);
  if($('wGuide').checked)drawGlyph(gx,padPx,writeList()[wIdx],{fill:cssVar('--line')});
}
function loadW(){ix.clearRect(0,0,padPx,padPx);drawn=false;$('wStars').textContent='';$('wMsg').textContent='';seqId++;if($('wParts'))renderParts(partsOf(writeList()[wIdx]),-1);sizePad()}
let down=false,last=null;
function pt(e){const r=ink.getBoundingClientRect();return[(e.clientX-r.left)/r.width*padPx,(e.clientY-r.top)/r.height*padPx]}
ink.addEventListener('pointerdown',e=>{down=true;ink.setPointerCapture(e.pointerId);last=pt(e);dot(last)});
ink.addEventListener('pointermove',e=>{if(!down)return;const p=pt(e);line(last,p);last=p});
['pointerup','pointercancel'].forEach(ev=>ink.addEventListener(ev,()=>{down=false}));
function pen(){ix.strokeStyle=cssVar('--ink');ix.fillStyle=cssVar('--ink');ix.lineWidth=padPx*0.06;ix.lineCap='round';ix.lineJoin='round'}
function dot(p){pen();ix.beginPath();ix.arc(p[0],p[1],padPx*0.03,0,7);ix.fill();drawn=true}
function line(a,b){pen();ix.beginPath();ix.moveTo(a[0],a[1]);ix.lineTo(b[0],b[1]);ix.stroke();drawn=true}
function scoreW(){
  const S=200,g=writeList()[wIdx];
  const mk=()=>{const c=document.createElement('canvas');c.width=c.height=S;return c.getContext('2d',{willReadFrequently:true})};
  const tg=mk(),th=mk(),us=mk();
  drawGlyph(tg,S,g,{fill:'#000'});
  drawGlyph(th,S,g,{fill:'#000',stroke:'#000',lw:S*0.07});
  us.drawImage(ink,0,0,S,S);
  const A=tg.getImageData(0,0,S,S).data,B=th.getImageData(0,0,S,S).data,U=us.getImageData(0,0,S,S).data;
  let tN=0,cov=0,uN=0,inN=0;
  for(let i=3;i<A.length;i+=4){const tA=A[i]>100,uA=U[i]>60;if(tA){tN++;if(uA)cov++}if(uA){uN++;if(B[i]>60)inN++}}
  if(!uN||!tN)return 0;
  return Math.min(1,(cov/tN)/0.6)*Math.min(1,(inN/uN)/0.8);
}
$('wCheck').onclick=()=>{
  if(!drawn){$('wMsg').textContent=t('w0');return}
  const s=scoreW(),n=s>=0.8?3:s>=0.55?2:s>=0.3?1:0;
  $('wStars').textContent='★'.repeat(n)+'☆'.repeat(3-n);
  $('wMsg').textContent=t(n===3?'w3':n===2?'w2':'w1');
  if(n===3)speak(writeList()[wIdx].length===1&&JAMO[writeList()[wIdx]]?soundOf(writeList()[wIdx]):writeList()[wIdx]);
};
$('wClear').onclick=loadW;
// 자음·모음·합친 소리를 따로따로 차례대로 들려주기
const CSOUND={'ㄱ':'그','ㄲ':'끄','ㄴ':'느','ㄷ':'드','ㄸ':'뜨','ㄹ':'르','ㅁ':'므','ㅂ':'브','ㅃ':'쁘','ㅅ':'스','ㅆ':'쓰','ㅇ':'응','ㅈ':'즈','ㅉ':'쯔','ㅊ':'츠','ㅋ':'크','ㅌ':'트','ㅍ':'프','ㅎ':'흐'};
const LBL={name:{ko:'이름',pt:'nome'},snd:{ko:'자음 소리',pt:'som'},vow:{ko:'모음 소리',pt:'vogal'},fin:{ko:'받침',pt:'final'},all:{ko:'합친 소리',pt:'junto'}};
function partsOf(g){
  const L=k=>LBL[k][lang];
  if(JAMO[g]&&JAMO[g].type==='c') return [{t:g,say:JAMO[g].name,lb:L('name')},{t:CSOUND[g],say:CSOUND[g],lb:L('snd')},{t:'+ ㅏ',say:'아',lb:L('vow')},{t:compose(g,'ㅏ'),say:compose(g,'ㅏ'),lb:L('all')}];
  if(JAMO[g]) return [{t:g,say:compose('ㅇ',g),lb:L('vow')},{t:'ㄱ',say:'그',lb:L('snd')},{t:compose('ㄱ',g),say:compose('ㄱ',g),lb:L('all')}];
  const d=decompose(g);if(!d)return[{t:g,say:g,lb:L('all')}];
  const out=[{t:d[0],say:CSOUND[d[0]]||d[0],lb:L('snd')},{t:d[1],say:compose('ㅇ',d[1]),lb:L('vow')}];
  if(d[2])out.push({t:d[2],say:JAMO[d[2]]?JAMO[d[2]].name:d[2],lb:L('fin')});
  out.push({t:g,say:g,lb:L('all')});return out;
}
let seqId=0;
function sayOnce(txt){return new Promise(res=>{
  if(!('speechSynthesis' in window)){ttsWarn();return res()}
  try{const u=new SpeechSynthesisUtterance(txt);u.lang='ko-KR';if(koVoice)u.voice=koVoice;u.rate=slow?0.5:0.7;
    let done=false;const fin=()=>{if(!done){done=true;res()}};u.onend=fin;u.onerror=fin;setTimeout(fin,3500);
    speechSynthesis.resume();speechSynthesis.speak(u);}catch(e){res()}
})}
function renderParts(list,on){
  $('wParts').innerHTML=list.map((p,i)=>(i?'<span class="arr">→</span>':'')+`<button class="part${i===on?' on':''}" data-i="${i}"><b>${p.t}</b><small>${p.lb}</small></button>`).join('');
  $('wParts').querySelectorAll('.part').forEach(b=>b.onclick=()=>{seqId++;speechSynthesis.cancel();renderParts(list,+b.dataset.i);speak(list[+b.dataset.i].say)});
}
async function playParts(){
  const g=writeList()[wIdx],list=partsOf(g),id=++seqId;
  try{speechSynthesis.cancel()}catch(e){}
  await new Promise(r=>setTimeout(r,80));
  for(let i=0;i<list.length;i++){if(id!==seqId)return;renderParts(list,i);await sayOnce(list[i].say);await new Promise(r=>setTimeout(r,350))}
  if(id===seqId)renderParts(list,-1);
}
$('wPlay').onclick=playParts;
$('wPrev').onclick=()=>{const L=writeList();wIdx=(wIdx-1+L.length)%L.length;loadW()};
$('wNext').onclick=()=>{const L=writeList();wIdx=(wIdx+1)%L.length;loadW()};

/* ---------- 4. 퀴즈 (1~10단) ---------- */
let qState=null,qLevel=store.get('hg-qlv',0);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const starsOf=(sc,n)=>{const r=sc/n;return r>=0.9?3:r>=0.7?2:r>=0.4?1:0};
function lvName(i){return T.lvNames[lang][i]}
function renderQLevels(){
  const best=store.get('hg-qbest',{});
  $('qLevels').innerHTML=LEVELS.map((_,i)=>{const st=best[i]!=null?starsOf(best[i],LEVELS[i].length):-1;
    return`<button class="lv${i>=10?' kpop':''}" data-lv="${i}" aria-pressed="${i===qLevel}"><b>${i>=10?(i>=12?'🎬 ':'🎤 ')+lvName(i):i+1}</b><small>${lvName(i)}</small><i>${st<0?'':'★'.repeat(st)+'☆'.repeat(3-st)}</i></button>`}).join('');
  $('qLevels').querySelectorAll('.lv').forEach(b=>b.onclick=()=>startQuiz(+b.dataset.lv));
}
function startQuiz(lv){
  if(lv!=null){qLevel=lv;store.set('hg-qlv',lv)}
  const items=LEVELS[qLevel];
  const qs=shuffle(items).map((w,i)=>{const types=w[4]?['pic','listen','mean']:['listen','mean'];
    return{w,type:types[i%types.length],opts:shuffle([w,...shuffle(items.filter(x=>x!==w)).slice(0,3)])}});
  qState={qs,i:0,score:0,answered:false};$('qEnd').hidden=true;$('qPlay').hidden=false;renderQLevels();renderQ();
}
function renderQ(){
  const s=qState,q=s.qs[s.i];
  $('qNum').textContent=`${qLevel>=10?lvName(qLevel):(qLevel+1)+(lang==='ko'?'단':'')} · ${s.i+1} / ${s.qs.length}`;$('qScore').textContent=`★ ${s.score}`;
  $('qBar').style.width=(s.i/s.qs.length*100)+'%';
  if(q.type==='mean'){
    $('qCard').innerHTML=`<div style="font-family:var(--f-disp);font-size:26px;line-height:1.3">“${q.w[1]}”</div><div class="msg" style="margin-top:6px">${lang==='ko'?'이 뜻의 한국말은?':'Como se diz em coreano?'}</div>`;
  }else if(q.type==='pic'){
    $('qCard').innerHTML=`<div class="q-pic" aria-hidden="true">${q.w[4]}</div><div class="msg">${t('qPic')}</div>`;
  }else{
    $('qCard').innerHTML=`<button class="btn primary big" id="qHear">🔊</button><div class="msg" style="margin-top:8px">${t('qListen')}</div>`;
    $('qHear').onclick=()=>speak(q.w[0]);
    if(!s.answered)setTimeout(()=>speak(q.w[0]),250);
  }
  $('qOpts').innerHTML='';
  q.opts.forEach(o=>{const b=document.createElement('button');b.className='opt';b.dataset.k=o[0];
    b.innerHTML=o[0]+`<small>${o[3]}</small>`;b.style.wordBreak='keep-all';
    if(o[0].length>8)b.style.fontSize='16px';else if(o[0].length>5)b.style.fontSize='18px';
    b.onclick=()=>answer(o,b);$('qOpts').appendChild(b)});
}
function answer(o,btn){
  const s=qState,q=s.qs[s.i];if(s.answered)return;s.answered=true;
  const ok=o===q.w;if(ok)s.score++;
  [...$('qOpts').children].forEach(b=>{if(b.dataset.k===q.w[0])b.classList.add('ok')});
  if(!ok)btn.classList.add('no');
  $('qScore').textContent=`★ ${s.score}`;speak(q.w[0]);
  setTimeout(()=>{s.i++;s.answered=false;if(s.i>=s.qs.length)endQuiz();else renderQ()},1300);
}
function endQuiz(){
  const s=qState,best=store.get('hg-qbest',{});best[qLevel]=Math.max(best[qLevel]||0,s.score);store.set('hg-qbest',best);
  $('qPlay').hidden=true;$('qEnd').hidden=false;$('qBar').style.width='100%';
  const st=starsOf(s.score,s.qs.length);
  $('qFinal').textContent=`${s.score} / ${s.qs.length}`;
  $('qFinalMsg').textContent='★'.repeat(st)+'☆'.repeat(3-st)+'  '+t(st===3?'end3':st===2?'end2':'end1');
  $('qBest').textContent=`${qLevel>=10?lvName(qLevel):(qLevel+1)+(lang==='ko'?'단':'')} ${t('best')}: ${best[qLevel]} / ${s.qs.length}`;
  $('qNextLv').hidden=qLevel>=LEVELS.length-1;
  renderQLevels();
}
$('qAgain').onclick=()=>startQuiz();

    b.onclick=()=>{sIdx=idx;renderSay();speak(x[0]);$('sCard').scrollIntoView({behavior:'smooth',block:'center'})};box.appendChild(b)});

function bindSyl(){$('sTarget').querySelectorAll('span').forEach(sp=>sp.onclick=()=>speak(sp.dataset.ch,0.5))}
$('sPlay').onclick=()=>speak(SAYI()[sIdx][0]);
$('sNext').onclick=()=>{sIdx++;if(sIdx>=SAYI().length){sIdx=0;sLv=(sLv+1)%LEVELS.length;store.set('hg-slv',sLv)}renderSay();speak(SAYI()[sIdx][0])};
const clean=s=>[...s].filter(ch=>/[가-힣]/.test(ch));
function align(target,heard){ // LCS: target 각 글자가 맞았는지
  const a=clean(target),b=heard,n=a.length,m=b.length,D=[...Array(n+1)].map(()=>Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)D[i][j]=a[i]===b[j]?D[i+1][j+1]+1:Math.max(D[i+1][j],D[i][j+1]);
  const ok=Array(n).fill(false);let i=0,j=0;
  while(i<n&&j<m){if(a[i]===b[j]){ok[i]=true;i++;j++}else if(D[i+1][j]>=D[i][j+1])i++;else j++}
  return{ok,score:n?D[0][0]/n:0};
}
function evaluate(alts){
  const target=SAYI()[sIdx][0];let best=null;
  alts.forEach(txt=>{const r=align(target,clean(txt));if(!best||r.score>best.score)best={...r,txt}});
  const syl=clean(target);let k=0;
  $('sTarget').innerHTML=[...target].map(ch=>{if(ch===' ')return' ';const cls=best.ok[k++]?'ok':'miss';return`<span class="${cls}" data-ch="${ch}">${ch}</span>`}).join('');
  bindSyl();
  const pct=Math.round(best.score*100),missed=syl.filter((_,i)=>!best.ok[i]);
  const tips=[...new Set(missed)].slice(0,4).map(ch=>{
    const d=decompose(ch);if(!d)return'';
    const parts=d.filter(Boolean).map(x=>{const j=JAMO[x];return j?`<b>${x}</b> ${lang==='ko'?j.ko:j.pt}`:`<b>${x}</b>`});
    return`<li><b style="font-size:18px">${ch}</b> = ${d.filter(Boolean).join(' + ')}<br>${parts.join('<br>')}</li>`}).join('');
  $('sFb').innerHTML=`<div class="score">${pct}%</div>
    <div>${t(pct===100?'perfect':pct>=70?'good':'retry')}</div>
    <div class="msg" style="text-align:left;margin-top:4px">${t('heard')}: “${best.txt||'…'}”</div>
    ${tips?`<div class="label" style="margin-top:10px">${t('tipFor')}</div><ul class="tips">${tips}</ul>`:''}`;
  $('sFb').hidden=false;
  if(pct>=90&&!said.has(target)){said.add(target);store.set('hg-said',[...said]);renderSayList()}
}
function stopListen(){listening=false;$('sMic').classList.remove('on');$('sMic').textContent=t('speak')}
$('sMic').onclick=()=>{
  if(listening){try{rec.stop()}catch(e){}return}
  if(!SR){showNote('noSR');return}
  speechSynthesis&&speechSynthesis.cancel();
  rec=new SR();rec.lang='ko-KR';rec.interimResults=true;rec.maxAlternatives=5;rec.continuous=false;
  let finalAlts=null;
  rec.onresult=e=>{
    const r=e.results[e.results.length-1];
    $('sStatus').textContent='“'+r[0].transcript+'”';
    if(r.isFinal)finalAlts=[...r].map(a=>a.transcript);
  };
  rec.onerror=e=>{
    if(['not-allowed','service-not-allowed','audio-capture'].includes(e.error))showNote('micBlocked');
    else if(e.error==='no-speech')$('sStatus').textContent=t('noSpeech');
    stopListen();
  };
  rec.onend=()=>{stopListen();if(finalAlts)evaluate(finalAlts)};
  try{rec.start();listening=true;$('sMic').classList.add('on');$('sMic').textContent=t('stop');$('sStatus').textContent='';$('sNote').hidden=true}
  catch(e){showNote('micBlocked')}
};
function showNote(k){$('sNote').textContent=t(k);$('sNote').hidden=false}

// 한글 → 브라질식 발음 자동 변환 (연음·비음화·구개음화 기본 규칙)
const PI={'ㄱ':'g','ㄲ':'kk','ㄴ':'n','ㄷ':'d','ㄸ':'tt','ㄹ':'r','ㅁ':'m','ㅂ':'b','ㅃ':'pp','ㅅ':'s','ㅆ':'ss','ㅇ':'','ㅈ':'dj','ㅉ':'jj','ㅊ':'tch','ㅋ':'k','ㅌ':'t','ㅍ':'p','ㅎ':'r'};
const PF={'':'','ㄱ':'k','ㄲ':'k','ㅋ':'k','ㄳ':'k','ㄺ':'k','ㄴ':'n','ㄵ':'n','ㄶ':'n','ㄷ':'t','ㅅ':'t','ㅆ':'t','ㅈ':'t','ㅊ':'t','ㅌ':'t','ㅎ':'t','ㄹ':'l','ㄼ':'l','ㄽ':'l','ㄾ':'l','ㅀ':'l','ㅁ':'m','ㄻ':'m','ㅂ':'p','ㅍ':'p','ㅄ':'p','ㄿ':'p','ㅇ':'ng'};
const LINK={'ㄳ':['ㄱ','ㅅ'],'ㄵ':['ㄴ','ㅈ'],'ㄺ':['ㄹ','ㄱ'],'ㄻ':['ㄹ','ㅁ'],'ㄼ':['ㄹ','ㅂ'],'ㄽ':['ㄹ','ㅅ'],'ㄾ':['ㄹ','ㅌ'],'ㄿ':['ㄹ','ㅍ'],'ㅄ':['ㅂ','ㅅ'],'ㄶ':['','ㄴ'],'ㅀ':['','ㄹ']};
function autoPron(text){
  return text.split(/\s+/).filter(Boolean).map(word=>{
    const ch=[...word].map(c=>{const d=decompose(c);return d?{c:d[0],v:d[1],f:d[2]}:{raw:c}});
    for(let i=0;i<ch.length-1;i++){const a=ch[i],b=ch[i+1];if(a.raw||b.raw||!a.f)continue;
      if(b.c==='ㅇ'){
        if(a.f==='ㅇ')continue;
        if(a.f==='ㅎ'){a.f='';continue}
        if(b.v==='ㅣ'&&(a.f==='ㄷ'||a.f==='ㅌ')){b.c=a.f==='ㄷ'?'ㅈ':'ㅊ';a.f='';continue}
        if(LINK[a.f]){b.c=LINK[a.f][1];a.f=LINK[a.f][0]}else{b.c=a.f;a.f=''}
      }else if(b.c==='ㄴ'||b.c==='ㅁ'){const p=PF[a.f];if(p==='p')a.f='ㅁ';else if(p==='k')a.f='ㅇ';else if(p==='t')a.f='ㄴ'}
    }
    return ch.map(x=>{if(x.raw)return x.raw.replace(/[^0-9A-Za-z]/g,'');let a=PI[x.c],v=PT_V[x.v].replace('ü','u');if(a==='g'&&/^[eéêi]/.test(v))a='gu';return a+v+PF[x.f]}).filter(Boolean).join('-');
  }).join(' ');
}
const pronOf=ko=>PRON[ko]||autoPron(ko);

// 저장소 (이 휴대폰 안에만 저장)
const idb=(()=>{let dbp=null;
  function open(){if(!dbp)dbp=new Promise((res,rej)=>{try{const q=indexedDB.open('hangul-songs',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}catch(e){rej(e)}});return dbp}
  async function tx(mode,fn){const db=await open();return new Promise((res,rej)=>{const t=db.transaction('kv',mode),q=fn(t.objectStore('kv'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})}
  return{get:k=>tx('readonly',st=>st.get(k)).catch(()=>null),set:(k,v)=>tx('readwrite',st=>st.put(v,k)).catch(()=>null),del:k=>tx('readwrite',st=>st.delete(k)).catch(()=>null)};
})();

let mySongs=[],curSong=null,audioURL=null,times=null,tapIdx=-1,lastOn=-1;
async function loadMine(){mySongs=(await idb.get('mysongs'))||[];renderSongList()}
function renderSongList(){

  all.forEach(sg=>{const b=document.createElement('button');b.className='scard'+(sg.mine?' mine':'');

async function openSong(sg){
  curSong=sg;$('nHome').hidden=true;$('nView').hidden=false;$('vConfirm').hidden=true;window.scrollTo(0,0);
  $('vTitle').textContent=sg.title;$('vSub').textContent=sg.pt||'';$('vDel').hidden=!sg.mine;
  $('vLyrics').innerHTML='';
  sg.lines.forEach((ln,i)=>{const li=document.createElement('li');li.innerHTML='<b></b><span class="pron"></span><small></small>';
    li.querySelector('b').textContent=ln[0];li.querySelector('.pron').textContent=pronOf(ln[0]);li.querySelector('small').textContent=ln[1]||'';
    li.onclick=()=>{if(times&&!$('vAudio').hidden&&tapIdx<0){$('vAudio').currentTime=times[i];$('vAudio').play().catch(()=>{})}else speak(ln[0])};
    $('vLyrics').appendChild(li)});
  if(sg.style){const all=sg.lines.map(l=>l[0]).join('\n');
    $('vStyle').innerHTML=`<div class="label" style="margin-top:0">${t('sunoStyle')}</div><div class="copybox" id="cpS"></div><button class="btn" data-cp="cpS">${t('copy')}</button>
      <div class="label">${t('sunoLyrics')}</div><div class="copybox" id="cpL" style="white-space:pre-line"></div><button class="btn" data-cp="cpL">${t('copy')}</button>`;
    $('cpS').textContent=sg.style;$('cpL').textContent=all;$('vStyle').hidden=false;
    $('vStyle').querySelectorAll('[data-cp]').forEach(bt=>bt.onclick=()=>{const txt=$(bt.dataset.cp).textContent;
      const ok=()=>{bt.textContent=t('copied');setTimeout(()=>bt.textContent=t('copy'),1500)};
      try{navigator.clipboard.writeText(txt).then(ok,()=>selectEl($(bt.dataset.cp)))}catch(e){selectEl($(bt.dataset.cp))}});
  }else $('vStyle').hidden=true;
  const blob=await idb.get('audio:'+sg.id);times=await idb.get('time:'+sg.id);setAudio(blob);
}
function selectEl(el){const rg=document.createRange();rg.selectNodeContents(el);const sl=getSelection();sl.removeAllRanges();sl.addRange(rg)}
function setAudio(blob){
  const a=$('vAudio');if(audioURL){URL.revokeObjectURL(audioURL);audioURL=null}
  if(blob){audioURL=URL.createObjectURL(blob);a.src=audioURL;a.hidden=false;$('vNoAudio').hidden=true}
  else{a.removeAttribute('src');a.hidden=true;$('vNoAudio').hidden=false;$('vNoAudio').textContent=t(curSong&&curSong.mine?'noAudioMine':'noAudio')}
  lastOn=-1;markLine(-1);
}
function markLine(i){[...$('vLyrics').children].forEach((li,k)=>li.classList.toggle('on',k===i));
  if(i>=0&&i!==lastOn){const li=$('vLyrics').children[i];li&&li.scrollIntoView({behavior:'smooth',block:'center'})}lastOn=i}
